spring.application.name=employee-management
server.port=8080

# MySQL (override with environment variables if needed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# Hibernate creates/updates the tables (department, employee) automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
