spring.application.name=employee-management
server.port=8080

# Active profile: dev or prod (override with: --spring.profiles.active=prod or env SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=dev

# Actuator: expose health, info and metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Cache: entries expire 1 minute after they are written
spring.cache.type=caffeine
spring.cache.cache-names=employeeReport
spring.cache.caffeine.spec=expireAfterWrite=1m

# JWT (the secret itself is set per profile)
jwt.expiration-ms=3600000

# Default admin account created at startup if it does not exist yet
app.admin.username=admin
app.admin.password=admin123
