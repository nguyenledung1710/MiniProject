<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: menu}"></div>

<h2>Add employee</h2>
<form th:action="@{/employees/add}" th:object="${employee}" method="post">
    <label>Name
        <input type="text" th:field="*{name}">
    </label>
    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

    <label>Email
        <input type="text" th:field="*{email}">
    </label>
    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

    <label>Password
        <input type="password" th:field="*{password}">
    </label>
    <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

    <label>Department
        <select th:field="*{departmentId}">
            <option value="">-- No department --</option>
            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
        </select>
    </label>

    <button type="submit">Save</button>
</form>
</body>
</html>
