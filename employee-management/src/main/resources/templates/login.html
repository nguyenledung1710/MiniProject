<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h2>Login</h2>

<p class="message" th:if="${param.registered}">Registration successful. Please log in.</p>
<p class="message" th:if="${param.logout}">You have been logged out.</p>
<p class="error" th:if="${param.error}">Invalid username or password.</p>

<form th:action="@{/login}" method="post">
    <label>Username
        <input type="text" name="username">
    </label>
    <label>Password
        <input type="password" name="password">
    </label>
    <button type="submit">Login</button>
</form>

<p>No account yet? <a th:href="@{/register}">Register</a></p>
</body>
</html>
